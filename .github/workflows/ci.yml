# 验证四层里的**前三层** —— 它们都不碰摄像头、不读 assets/、不下载模型,
# 所以能在 CI 上无条件跑完(实测本地合计 <5 秒, CI 上的时间几乎全花在装
# mediapipe 上)。
#
# 第四层 tools/e2e_check.py 需要 assets/sample.mp4(**不在 git 里**: 那是原作者的
# 视频, 自备一段放到这个路径)加上自动下载的 7.5MB 模型, 而且要跑 358 帧真实
# 推理 —— 那层留在本地: 改过
# screen 的几何/映射/滤波就必须自己跑一遍(README「开发」一节)。CI 绿了
# **不代表**没有颜色频闪。
name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 本地开发跑 3.14; CI 钉 3.12 是因为 mediapipe 的 wheel 对新版本
          # 一向滞后, 让 CI 去等 wheel 只会换来和本项目无关的红。
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 装 OpenCV 的运行时依赖
        # opencv-contrib-python 是**带 GUI** 的发行版(live 要 imshow), import
        # 时就会去连 libGL —— headless runner 上缺它会在 `import cv2` 当场炸,
        # 报一个和本项目毫无关系的 ImportError。装上就行, 不要为了 CI 换成
        # headless 包: 那会让 CI 装的和哥哥本地跑的不是同一个 opencv。
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: 装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 静态检查
        run: ruff check main.py src tools tests

      - name: 契约 + 渲染冒烟
        run: pytest

      - name: cube 手感底线
        run: PYTHONPATH=src python tools/cube_check.py
